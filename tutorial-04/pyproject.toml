[project]
name = "tutorial-04-source-code-analysis-with-ai"
version = "0.1.0"
description = "Translate an English security concern into a semgrep rule with Claude, run it across WebGoat's source, then triage findings by exploitability. Companion code for AI for Cybersecurity Fundamentals T4."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Long", email = "ngothanglong@gmail.com" },
]
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
tutorial-04 = "tutorial_04.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tutorial_04*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
