[project]
name = "tutorial-02-sqli-with-ai"
version = "0.1.0"
description = "Drive sqlmap against a WebGoat SQLi lesson and ask Claude to summarise the result. Companion code for AI for Cybersecurity Fundamentals T2."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Long", email = "ngothanglong@gmail.com" },
]
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
tutorial-02 = "tutorial_02.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tutorial_02*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
